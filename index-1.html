 {
  "title": "Dogtown, in plain English",
  "blocks": [
   [
    "h",
    "Dogtown and BARGHEST"
   ],
   [
    "p",
    "Dogtown is a walled-off district of Night City. BARGHEST is the armed force Kurt commands there. The Black Sapphire is his tower, a place for business, parties, security operations and, upstairs, home."
   ],
   [
    "h",
    "The work"
   ],
   [
    "p",
    "A netrunner is a hacker who can get into cameras, networks and cyberware. A fixer brokers jobs for mercenaries. A braindance, or BD, lets someone experience a recording through the senses of the person who lived it."
   ],
   [
    "h",
    "The outsiders"
   ],
   [
    "p",
    "NUSA means New United States of America. Rosalind Myers is its president. Solomon Reed and Song So Mi, also called Songbird, work for its intelligence agency."
   ]
  ],
  "id": 1,
  "name": "Dogtown, in plain English",
  "note": "I forget people outside Dogtown need subtitles for half my life.",
  "source": "",
  "group": "Reference"
 },
 {
  "title": "Meet Warhound",
  "blocks": [
   [
    "h",
    "The short version"
   ],
   [
    "p",
    "Spyder is a punk hacker who makes his living taking mercenary jobs around Night City. Colonel Kurt Hansen runs Dogtown, a walled-off district, with his own armed force, BARGHEST. Warhound is the name for the two of them together."
   ],
   [
    "p",
    "Kurt can use someone who gets through a locked door without sending a squad. Spyder gets to take work directly from him and still ride back out into the city. That freedom matters to a guy who generally has strong opinions about people giving him orders."
   ],
   [
    "p",
    "Trust comes first. Eventually Kurt is his commander, his boyfriend and the dom he calls Daddy in private. Spyder can cover him from a rooftop on a job and go home to his lap at the Black Sapphire afterward."
   ],
   [
    "h",
    "Where their story departs from the game"
   ],
   [
    "p",
    "In Cyberpunk 2077: Phantom Liberty, the mercenary V gets pulled into a fight over President Myers. Spyder is the V in this telling. When loyalties split, he chooses Kurt. The main story here follows their life together. A separate, spoiler-marked file follows a different ending."
   ]
  ],
  "id": 2,
  "name": "Meet Warhound",
  "note": "I’m Spyder. V if you’re paying me. Kurt calls me pup, which is how you know this man gets privileges.",
  "source": "",
  "group": "Warhound"
 },
 {
  "title": "Spyder",
  "blocks": [
   [
    "h",
    "The guy behind the handle"
   ],
   [
    "p",
    "Spyder is a trans man from New York, all choppy dark hair, piercings, ink and military cargos. Computers, bikes and exposed circuitry can hold his attention as thoroughly as a person can. He likes noise. On a Watson rooftop he can have the city humming away below him and still be alone."
   ],
   [
    "h",
    "What he does"
   ],
   [
    "p",
    "He slips into networks, hunts hostile netrunners and watches targets through a scope. He favors sniper rifles and tech or smart weapons. Getting in quietly lets him reach places a uniformed squad would announce itself halfway down the block."
   ],
   [
    "h",
    "Before Kurt"
   ],
   [
    "p",
    "He was already good at keeping other people alive. For a long time he cared considerably less about getting himself home. He liked Dum-Dum, ran with dangerous company and could plan a job down to the minute while barely thinking about tomorrow."
   ]
  ],
  "id": 3,
  "name": "Spyder",
  "note": "NYC punk. Netrunner. Pretty good shot. V is the name on the gig. Spyder is the name he uses.",
  "source": "",
  "group": "Dossiers"
 },
 {
  "title": "Kurt Hansen",
  "blocks": [
   [
    "h",
    "The man who runs Dogtown"
   ],
   [
    "p",
    "Kurt is a former NUSA colonel who held onto Dogtown and built BARGHEST there. Arms deals, smuggling routes and the loyalty of his soldiers keep him in power. He can host a roomful of wealthy guests upstairs while his people secure a shipment below."
   ],
   [
    "h",
    "What his soldiers see"
   ],
   [
    "p",
    "BARGHEST offers pay, training, medical care and a place to belong. Kurt expects loyalty in return. A subordinate who spots a flaw in a plan has his attention. Someone who puts the unit at risk to prove a point has it for another reason."
   ],
   [
    "h",
    "What Spyder sees"
   ],
   [
    "p",
    "Kurt notices a change in his voice, remembers which equipment he uses and knows when to let a silence sit. He still has people waiting on a decision. Being welcome beside him while he works means a great deal to Spyder."
   ]
  ],
  "id": 4,
  "name": "Kurt Hansen",
  "note": "I watched a combat BD for the man’s technique. Then I watched it again. His technique was still excellent.",
  "source": "",

    "h",
    "The exception"

   [

    "Afterward"

    "p",

 },
 {

 {

 {

];</script><script>const main=document.querySelector('main');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=[];
try{saved=JSON.parse(localStorage.getItem('warhound.saved'))||[]}catch{}
let filter='All',query='',back='home';
function row(f){return '<a class="row" href="#file-'+f.id+'"><span class="num">'+String(f.id+1).padStart(2,'0')+'</span><span><small class="meta">'+esc(f.group.toUpperCase())+'</small><b>'+esc(f.name)+'</b></span><span class="go" aria-hidden="true">↗</span></a>'}
function home(){main.innerHTML=`<section class="hero"><div class="herotxt"><div class="label">BARGHEST // PERSONAL FILES</div><h1>WARHOUND</h1><p>My archive on Colonel Kurt Hansen. Yeah, I gave him his own directory.</p><a class="btn" href="#file-2">Meet us in two minutes <span>→</span></a></div><span class="stamp">CAPTURE / BLACK SAPPHIRE</span></section><div class="section"><h2>Pinned files</h2><a class="link" href="#index">All files ↗</a></div><div class="cards"><a class="card kurt" href="#file-4"><span class="label">PERSONNEL</span><strong>Kurt Hansen</strong><span class="meta">COLONEL / BARGHEST</span><span class="arrow">↗</span></a><a class="card spy" href="#file-3"><span class="label">PERSONNEL</span><strong>Spyder</strong><span class="meta">NETRUNNER / OPERATOR</span><span class="arrow">↗</span></a><a class="memo" href="#file-24"><span class="meta">PUP’S NOTES</span><p>“I kept the hair. I mouth off. He knows exactly what he lets me get away with.”</p><b>— spyderbyte</b><span class="arrow">↗</span></a></div><div class="section"><h2>Inside Warhound</h2></div>`+[1,6,16,9,10,21,23].map(i=>row(files[i])).join('')}
function indexPage(isSaved){main.innerHTML='<section class="page"><div class="label">WARHOUND / DIRECTORY</div><h1>'+(isSaved?'Saved files':'File index')+'</h1><input class="search" aria-label="Search lore" placeholder="Search names, memories, places…" type="search"><div class="filters"></div><div class="meta" id="count" role="status"></div><div id="results"></div></section>';
const input=main.querySelector('input');input.value=query;
function results(){const q=query.trim().toLowerCase();const matches=files.filter(f=>(!isSaved||saved.includes(f.id))&&(filter==='All'||filter===f.group)&&[f.name,f.title,f.note,f.source,...f.blocks.flat()].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=matches.length+' '+(matches.length===1?'FILE':'FILES');document.querySelector('#results').innerHTML=matches.map(row).join('')||'<p class="quiet">'+(isSaved&&!saved.length?'Save a file while reading to keep it here.':'No matching files. Try another word or category.')+'</p>'}
function filters(){const wrap=main.querySelector('.filters');wrap.replaceChildren();for(const cat of ['All','Dossiers','Warhound','Fieldwork','Reference']){const b=document.createElement('button');b.className='chip';b.textContent=cat;b.setAttribute('aria-pressed',filter===cat);b.onclick=()=>{filter=cat;filters();results();wrap.querySelector("[aria-pressed=true]").focus()};wrap.append(b)}}input.oninput=()=>{query=input.value;results()};filters();results()}
function groups(f){let g=[],current={title:'File notes',body:[]};for(const [type,a,b] of f.blocks){if(type==='h'){if(current.body.length)g.push(current);current={title:a,body:[]}}else if(type==='pair'){current.body.push('<p><strong>'+esc(a)+'</strong>'+(b?'<br>'+esc(b):'')+'</p>')}else{current.body.push('<p>'+esc(a)+'</p>')}}if(current.body.length)g.push(current);return g}
function reader(f){const grouped=groups(f);main.innerHTML='<article class="page"><div class="tools"><a class="link" href="#'+back+'">← '+({home:'Overview',saved:'Saved files',index:'File index'}[back])+'</a><button class="chip" id="save"></button></div><div class="label">'+esc(f.group.toUpperCase())+' / FILE '+String(f.id+1).padStart(2,'0')+'</div><h1>'+esc(f.name)+'</h1><div class="meta">'+esc(f.source)+'</div><aside class="quote"><span class="meta">PUP’S NOTES</span><p>'+esc(f.note)+'</p></aside><div class="details">'+grouped.map((g,i)=>'<details '+((i===0||f.id===2)&&![11,12,22].includes(f.id)?'open':'')+'><summary>'+esc(g.title==='File notes'?f.title:g.title)+'</summary>'+g.body.join('')+'</details>').join('')+'</div><div class="footnav"><a class="link" href="#index">File index</a>'+(f.id+1<files.length?'<a class="link" href="#file-'+(f.id+1)+'">Next file →</a>':'')+'</div></article>';const b=document.querySelector('#save');function label(){b.setAttribute('aria-pressed',saved.includes(f.id));b.textContent=saved.includes(f.id)?'✓ Saved':'＋ Save file'}b.onclick=()=>{saved=saved.includes(f.id)?saved.filter(i=>i!==f.id):[...saved,f.id];try{localStorage.setItem('warhound.saved',JSON.stringify(saved))}catch{}label()};label()}
function render(){const route=location.hash.slice(1)||'home';const id=/^file-(\d+)$/.exec(route);const file=id&&files[Number(id[1])];if(file)reader(file);else if(route==='index'||route==='saved'){if(back!==route){query='';filter='All'}back=route;indexPage(route==='saved')}else{back='home';home()}for(const a of document.querySelectorAll('.tabs a')){a.removeAttribute('aria-current');if(a.hash==='#'+back)a.setAttribute('aria-current','page')}document.title=(file?file.name+' | ':'')+'Warhound';window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();main.focus({preventScroll:true})});render()
</script></body></html>
